.code .sl{cursor:pointer;background:transparent;color:var(--tx)}.code .sl.f{color:var(--ok)}.code .sl:hover{border-color:var(--cy)}.code .sl:disabled{opacity:.35;cursor:default}.code .sl:disabled:hover{border-color:var(--ln)}.code .sl.c{outline:2px solid var(--cy);outline-offset:1px}

 <div class="tt"><small>ХИМИЯ 8 КЛАСС · ДЕТЕКТИВНЫЙ ПРАКТИКУМ</small><b>Дело № 9: Криогенный шантаж профессора Криоса</b></div>

<script>
var E=[
{t:"Тайна радиоактивной метки",

 link:"Найденный металл Криос сжёг в атмосфере раскалённого азота.",

 key:"3Z + 2 = 38, Z = 12, магний, ²⁸Mg (16 нейтронов). Код 12."},
{t:"Слепой взлом нитрида",

 link:"Нитрид зафиксирован. В вентиляции обнаружен летучий растворитель с серой.",

 key:"Магний здесь ²⁸Mg, Ar = 28. w(N) = 25 %; 75/28 : 25/14 = 3 : 2; Mg₃N₂, 5 атомов. Код 5."},
{t:"Летучая жидкость",
 story:"В вентиляции найден запечатанный растворитель: бинарное соединение серы с хлором.",

 link:"Серу из растворителя Криос перевёл в серную кислоту для следующего синтеза.",

 key:"M = 67,5·2 = 135; m(S) = 64 г, 2 атома; m(Cl) = 71 г, 2 атома; S₂Cl₂. Код 135."},
{t:"Скрытая вода соли магния",
 story:"Магний и серная кислота дали сульфат магния, из раствора которого выросли кристаллы.",
 note:"«Я взял 5,00 г кристаллогидрата MgSO₄·xH₂O и прокалил его до полного испарения воды. Масса сухой соли MgSO₄ составила 2,48 г. Определите x!»",
 link:"В реакторе осталась безводная соль. Её количество вещества пригодится дальше. В вентиляции запущен газовый заслон.",
 lab:"🔑 ЦИФРА КОДА № 4: число молекул воды x",num:[7],
 x:{lab:"📦 Формула кристаллогидрата",a:["mgso47h2o"]},
 key:"M(MgSO₄) = 28 + 32 + 64 = 124. m(H₂O) = 2,52 г; n(соли) = 2,48/124 = 0,02 моль; n(H₂O) = 0,14 моль; x = 7. Код 7."},
{t:"Газовый заслон",
 story:"Топливо в камере сгорания горело при недостатке воздуха, и в вентиляции появилась смесь угарного и углекислого газов.",
 note:"«Смесь CO и CO₂ имеет массу 60 г и общее количество вещества 2 моль. Найдите массовую долю кислорода (Оксигена) в этой смеси, в процентах!»",
 link:"Заслон пройден. Теперь соль из эпизода 4 нужно осадить.",
 lab:"🔑 ЦИФРА КОДА № 5: массовая доля кислорода, %",num:[60],
 key:"Система: a + b = 2, 28a + 44b = 60; b = 0,25, a = 1,75. m(O) = 36 г, 36/60 = 60 %. Или M(ср) = 30."},
{t:"Осадок и избыток",
 story:"Всю безводную соль из эпизода 4 Криос растворил в воде и добавил щёлочь.",
 note:"«К раствору этой соли (её количество вещества вы нашли в эпизоде 4) я добавил 20 г 10 %-го раствора NaOH. Выпал белый осадок Mg(OH)₂. Найдите массу осадка в миллиграммах. Какое из исходных веществ осталось в растворе и сколько граммов его осталось?»",
 link:"Осадок направлен в криогенный сенсор сервера.",
 lab:"🔑 ЦИФРА КОДА № 6: масса осадка, мг",num:[1240],tol:.007,
 x:{lab:"📦 Масса оставшегося исходного вещества, г",n:0.4},
 key:"MgSO₄ + 2NaOH → Mg(OH)₂↓ + Na₂SO₄. n(NaOH) = 0,05 моль, нужно 0,04: избыток 0,01 моль = 0,4 г. Осадок 0,02 моль, M(Mg(OH)₂) = 62: 1,24 г = 1240 мг."},
{t:"Нейтроны в осадке",
 story:"Замок сервера требует микроструктурный параметр осадка.",
 note:"«Весь магний, который я использовал, — это тот самый радиоактивный изотоп из эпизода 1. Кислород в моих реактивах только ¹⁶O, водород только ¹H. Сколько нейтронов содержится в осадке из эпизода 6? Запишите ответ как число, умноженное на 10²², округлив до целого!»",
 link:"Все 7 улик собраны. Переходим к терминалу сервера.",
 lab:"🔑 ЦИФРА КОДА № 7: число перед 10²²",num:[39,38],tol:.002,
 key:"Нейтронов на формульную единицу: 16 + 2·8 + 0 = 32; 0,02·32 = 0,64 моль; ·6,02·10²³ = 3,85·10²³ = 38,5·10²² → 39 (38 при NA = 6·10²³)."}
];
var PAL=["₂","₃","₄","⁺","²","³","⁻","¹","·","→","↓","×","/","(",")","ω","Ar","Mr","≈","⁰"];
var cur=0,solved=[],notes=[],sv=[],alarms=0,LEFT=3600,started=false,tid=null,fin=false;
var $=function(i){return document.getElementById(i)};
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function nf(s){var m={"₀":0,"₁":1,"₂":2,"₃":3,"₄":4,"₅":5,"₆":6,"₇":7,"₈":8,"₉":9,"⁰":0,"¹":1,"²":2,"³":3,"⁴":4,"⁵":5,"⁶":6,"⁷":7,"⁸":8,"⁹":9};
 return s.toLowerCase().replace(/[₀-₉⁰¹²³⁴-⁹]/g,function(c){return m[c]}).replace(/[\s·*.•×\-–]/g,"")}
function num(v){return parseFloat(String(v).replace(",",".").replace(/\s/g,""))}
function ov(h){var o=document.createElement("div");o.className="ov";o.innerHTML="<div>"+h+'<p><button class="btn" id="cl">Закрыть</button></p></div>';document.body.appendChild(o);
 $("cl").onclick=function(){o.remove()};o.onclick=function(e){if(e.target===o)o.remove()}}
function legend(){return '<div class="ev big"><small>THE EVIDENCE ROOM · СЛАЙД 1</small><h1>Криогенный шантаж</h1><small>СРОЧНАЯ РАДИОГРАММА · ШЕФ БЮРО</small>'+
 '<div class="note">«Детектив, срочный вызов! Полчаса назад безумный химик Профессор Криос заблокировал главный сервер Бюро и запустил 60-минутный таймер химической атаки. Он угрожает распылить в здании токсичный газ. Сервер защищён кодом из семи чисел. Нам предстоит распутать цепочку из 7 улик вокруг одного металла: от микромира атомов до уравнений реакций. Время пошло!»</div>'+
 '<small>ПРАВИЛА РАССЛЕДОВАНИЯ</small><ol class="rules"><li>Слева улики и записки Криоса, справа твой блокнот. Решай там как на бумаге; кнопки над блокнотом вставляют индексы и стрелки.</li><li>В конце каждого эпизода введи число кода и, если просят, вещество-улику. Верный ответ открывает замок и записывает число в код сервера.</li><li>Подсказок нет. Рассуждай вслух: детектив обсуждает ход мысли с напарником.</li><li>Таблица Ar доступна в любой момент. Атомные массы округляй до целых (кроме Cl = 35,5).</li></ol>'+
 (started?'<p>Расследование идёт. Нажми «Вперёд».</p>':'<button class="btn" id="go">Начать расследование</button>')+'</div>'}
function episode(i){var e=E[i],d=solved[i]!=null;
 return '<section class="ep"><div class="ev"><small>THE EVIDENCE ROOM · УЛИКА № '+(i+1)+'</small><h2>Эпизод '+(i+1)+'. «'+e.t+'»</h2><small>СЮЖЕТ ДЕЛА</small><div>'+e.story+'</div><small>ЗАПИСКА КРИОСА</small><div class="note">'+e.note+'</div>'+(d?'<div class="lnk">'+e.link+'</div>':'')+'</div>'+
 '<div class="ws"><small style="margin-top:0">THE WORKSPACE · БЛОКНОТ РЕШЕНИЯ</small><div class="pal">'+PAL.map(function(p){return'<button type="button" data-p="'+p+'" aria-label="Вставить '+p+'">'+p+'</button>'}).join("")+'</div>'+
 '<textarea id="nb" aria-label="Блокнот решения" placeholder="Решение пиши здесь"></textarea>'+
 '<div class="fld"><label for="f1">'+e.lab+'</label><input id="f1" type="text" inputmode="decimal" autocomplete="off"'+(d?' disabled':'')+'></div>'+
 (e.x?'<div class="fld"><label for="f2">'+e.x.lab+'</label><input id="f2" type="text" autocomplete="off"'+(d?' disabled':'')+'></div>':'')+
 '<div id="res"></div>'+(d?'':'<button class="btn" id="chk">Проверить</button>')+'</div></section>'}
function terminal(){var ok=solved.filter(function(x){return x!=null}).length==7;
 return '<div class="ev big"><small>CRYOGENIC SECURITY TERMINAL · СЛАЙД 9</small><h1>Терминал сервера Бюро</h1><div>Статус сервера: '+(fin?'РАЗБЛОКИРОВАН':'ЗАБЛОКИРОВАН')+'</div><div class="tsl">'+
 E.map(function(e,i){return'<div class="sl'+(solved[i]!=null?' f':'')+'"><i>№ '+(i+1)+'</i>'+(solved[i]!=null?solved[i]:'?')+'</div>'}).join("")+'</div>'+
 (fin?'<div class="note">Шеф Бюро: «Блестящая работа, детектив! Сервер разблокирован, газ не распылён. Единая цепочка превращений магния раскрыта: от атома ²⁸Mg до осадка Mg(OH)₂.»</div><p>Итог: осталось времени '+fmt(LEFT)+', тревог '+alarms+'.</p><p><small>Теперь разбор: что было самым неожиданным? Как ты справилась с избытком, если его не проходили? Почему магний не образует ион Mg³⁺?</small></p>':
 '<p>'+(ok?'Все семь улик собраны.':'Сервер откроется, когда будут решены все семь эпизодов.')+'</p><button class="btn" id="unl"'+(ok?'':' disabled')+'>Разблокировать сервер Бюро</button>')+'</div>'}
function render(){var m=$("main");m.innerHTML=cur==0?legend():cur<8?episode(cur-1):terminal();
 if(cur>0&&cur<8){var i=cur-1,v=sv[i]||{};$("nb").value=notes[i]||"";$("nb").oninput=function(){notes[i]=this.value};
  if(v.a!=null){$("f1").value=v.a;if($("f2"))$("f2").value=v.b;$("f1").className="ok";if($("f2"))$("f2").className="ok";fin2(i)}
  document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){var a=$("nb"),s=a.selectionStart,t=this.dataset.p;a.value=a.value.slice(0,s)+t+a.value.slice(a.selectionEnd);a.selectionStart=a.selectionEnd=s+t.length;a.focus();notes[i]=a.value}});
  if($("chk"))$("chk").onclick=function(){check(i)};
  m.querySelectorAll(".fld input").forEach(function(x){x.onkeydown=function(e){if(e.key==="Enter"&&$("chk"))check(i)}})}
 if($("go"))$("go").onclick=function(){started=true;tid=setInterval(tick,1000);cur=1;render()};
 if($("unl"))$("unl").onclick=function(){fin=true;clearInterval(tid);render()};
 paint()}
function fin2(i){var r=$("res");r.innerHTML='<div class="msg ok">Замок открыт! Число записано в код сервера.</div>'+(i<6?'<button class="btn" id="nx">К следующей улике</button>':'<button class="btn" id="nx">В терминал сервера</button>');$("nx").onclick=function(){cur++;render()}}
function check(i){var e=E[i],a=num($("f1").value),b=$("f2")?$("f2").value:"",t=e.tol||.005,
 g1=!isNaN(a)&&e.num.some(function(n){return Math.abs(a-n)<=n*t}),
 g2=!e.x||(e.x.n!=null?Math.abs(num(b)-e.x.n)<=e.x.n*.02:e.x.a.indexOf(nf(b))>-1);
 $("f1").className=g1?"ok":"bad";if(e.x)$("f2").className=g2?"ok":"bad";
 if(g1&&g2){solved[i]=a;sv[i]={a:$("f1").value,b:b};$("f1").disabled=true;if($("f2"))$("f2").disabled=true;$("chk").remove();
  document.querySelector(".ev").insertAdjacentHTML("beforeend",'<div class="lnk">'+e.link+'</div>');fin2(i);paint()}
 else{alarms++;$("res").innerHTML='<div class="msg bad shake">ТРЕВОГА! Ответ не сходится с уликами. Перепроверь расчёт.</div>'}}
function op(){var k=0;while(k<7&&solved[k]!=null)k++;return k+1}
function tick(){LEFT--;paint();if(LEFT==0)ov("<h2>Время вышло</h2><p>Газ уже идёт по вентиляции, но код ещё можно ввести. Быстрее!</p>")}
function paint(){$("tm").textContent=fmt(LEFT);$("tmw").className="tm"+(LEFT<300?" low":"");
 $("code").innerHTML=E.map(function(e,i){var d=solved[i]!=null;return'<button type="button" class="sl'+(d?' f':'')+(cur==i+1?' c':'')+'" data-go="'+(i+1)+'"'+(i+1>op()?' disabled':'')+' aria-label="Перейти к эпизоду '+(i+1)+'"><i>'+(i+1)+'</i>'+(d?solved[i]:'?')+'</button>'}).join("");
 document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){if(started&&+this.dataset.go<=op()){cur=+this.dataset.go;render()}}});
 $("prev").disabled=cur==0;$("next").disabled=!started||cur==8||(cur>0&&solved[cur-1]==null)}
$("prev").onclick=function(){cur--;render()};$("next").onclick=function(){cur++;render()};
$("bref").onclick=function(){ov('<h2>Справочник детектива</h2><table><tr><td>H</td><td>1</td><td>Na</td><td>23</td></tr><tr><td>C</td><td>12</td><td>Mg</td><td>см. эпизод 1</td></tr><tr><td>N</td><td>14</td><td>S</td><td>32</td></tr><tr><td>O</td><td>16</td><td>Cl</td><td>35,5</td></tr></table><p>Число Авогадро N<sub>A</sub> = 6,02·10<sup>23</sup> моль<sup>−1</sup></p>')};
$("bt").onclick=function(){ov('<h2>Режим учителя</h2><p><label>Пароль <input id="pw" type="password" style="font-size:18px;padding:4px"></label> <button class="btn" id="pk" style="margin:0">Открыть</button></p><div id="kb"></div>');
 var f=function(){if($("pw").value==="krios")$("kb").innerHTML="<table>"+E.map(function(e,i){return"<tr><td><b>"+(i+1)+"</b></td><td>"+e.key+"</td></tr>"}).join("")+"</table>";else $("kb").textContent="Неверный пароль."};
 $("pk").onclick=f;$("pw").onkeydown=function(e){if(e.key==="Enter")f()}};
render();
